# Manté despert el projecte de Supabase del Faristol (pla gratuït).
# Dues vegades per setmana fa una consulta minúscula; no llegeix ni escriu cap dada.
name: Supabase desperta

on:
  schedule:
    - cron: "17 9 * * 1,4"   # dilluns i dijous, cap a les 10–11 h
  workflow_dispatch: {}       # botó «Run workflow» per provar-ho a mà

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta petita a Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ihazuxgudnqrnxlswhmp.supabase.co/rest/v1/fs_items?select=id&limit=1" \
            -H "apikey: sb_publishable_usCM_Z6_0cSbCr1rrJnkuQ_dnvIQQTq")
          echo "Resposta de Supabase: $code"
          test "$code" = "200"
